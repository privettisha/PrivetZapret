name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tgws:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: tgws-windows
            output: PrivetTgWs.exe
          - os: ubuntu-latest
            artifact: tgws-linux
            output: PrivetTgWs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned TG WS Proxy source
        shell: bash
        run: |
          git clone https://github.com/Flowseal/tg-ws-proxy.git tgws
          git -C tgws checkout --detach 307a384ab7f522e34bb1a045884d0bd90f40bee5
          test "$(git -C tgws rev-parse HEAD)" = "307a384ab7f522e34bb1a045884d0bd90f40bee5"
          python build/patch_tgws.py
      - name: Build headless Telegram helper
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0 certifi httpx[http2]==0.28.1 cryptography==46.0.5
          python -m PyInstaller --noconfirm --clean --onefile --console \
            --name PrivetTgWs --paths tgws build/tgws_main.py
          test -f "dist/${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  build:
    needs: tgws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: tgws-windows
          path: .artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: tgws-linux
          path: .artifacts/linux
      - name: Bundle Telegram helpers
        run: |
          install -m 0644 .artifacts/windows/PrivetTgWs.exe payload/windows/PrivetTgWs.exe
          install -m 0755 .artifacts/linux/PrivetTgWs payload/linux/PrivetTgWs
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/PrivetZapret-Windows-x64.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/PrivetZapret-Arch-x64 .
          cd dist
          sha256sum PrivetZapret-Windows-x64.exe PrivetZapret-Arch-x64 > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
